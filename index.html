<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- fontAwesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="shortcut icon"
      href="./images/favicon-32x32.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <img src="./images/logo.svg" alt="logo" />
      <p id="lauching">
        <span id="launch">We are launching</span> <b>soon!</b>
      </p>
      <p id="subcribe">Subscribe and get notified</p>

      <div class="form_container">
        <form id="submit">
          <input
            type="email"
            name="email"
            id="email"
            required
            placeholder="Your email address..."
          />
          <button type="submit">Notify Me</button>
        </form>
        <p id="errorMessage"></p>
      </div>

      <div class="chart">
        <img src="./images/illustration-dashboard.png" alt="" />
      </div>

      <div class="socil_links">
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>

        <p>&copy; Copyright Ping. All rights reserved</p>
      </div>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
